<title>Image Art Teams</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one phone-width column of call sheets. A date block leads each job; the job page reads top to bottom in the order a photographer needs it on the day. */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --ink:#15201E; --muted:#586866; --line:#D3DBD9;
  --accent:#0B6B63; --accent-ink:#FFFFFF; --accent-soft:#DAEDEA;
  --flag:#9A4A06; --flag-soft:#FBEBCB; --ok:#1F7A3D;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1514; --surface:#18201E; --ink:#E7EEEC; --muted:#93A3A0; --line:#2A3633;
  --accent:#4FC4B6; --accent-ink:#06211E; --accent-soft:#15302C;
  --flag:#F2B04A; --flag-soft:#38290C; --ok:#6BCB8B; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#18201E; --ink:#E7EEEC; --muted:#93A3A0; --line:#2A3633;
  --accent:#4FC4B6; --accent-ink:#06211E; --accent-soft:#15302C;
  --flag:#F2B04A; --flag-soft:#38290C; --ok:#6BCB8B; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.app{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:20px}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.who select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.proto{font-size:14px;color:var(--muted)}

.tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tab{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500}
.tab[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-family:var(--mono);font-size:12px;background:var(--flag-soft);color:var(--flag);border-radius:999px;padding:1px 7px;margin-left:4px}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.small{padding:5px 10px;font-size:14px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500}

.list{display:flex;flex-direction:column;gap:10px}
.job{display:grid;grid-template-columns:64px 1fr;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
.job:hover{border-color:var(--accent)}
.dateblock{font-family:var(--mono);text-align:center;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line);padding-right:14px;line-height:1.2}
.dateblock .dow,.dateblock .mon{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dateblock .day{font-size:26px;font-weight:600}
.jobmain{min-width:0;display:flex;flex-direction:column;gap:4px}
.jobmain h3{font-size:18px}
.meta{font-size:14px;color:var(--muted)}
.time{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--flag-soft);color:var(--flag)}
.pill.quiet{background:var(--accent-soft);color:var(--accent)}
.rowwrap{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}

.sheet{display:flex;flex-direction:column;gap:20px}
.sheet-head{display:flex;flex-direction:column;gap:8px}
.sheet-head h1{font-size:clamp(26px,6vw,34px)}
.calltimes{display:flex;flex-wrap:wrap;gap:8px 28px;border-block:1px solid var(--line);padding-block:12px}
.calltimes div{display:flex;flex-direction:column}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.calltimes .v{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h2{font-size:18px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px}
.kv dt{color:var(--muted);font-size:14px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
dl{margin:0}
.sel{user-select:all;font-family:var(--mono);font-size:15px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;white-space:pre-wrap}
.alert{background:var(--flag-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.alert strong{color:var(--flag)}
.alert ul,.plain{margin:0;padding-left:18px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.checks input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.checks input:checked + span{color:var(--muted);text-decoration:line-through}
.crew{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.crew li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.deliv{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.deliv li{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.deliv label{display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0}
.deliv input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent)}
.inp{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;max-width:100%}
fieldset.pick{flex-direction:column;flex-wrap:nowrap;gap:12px;background:var(--surface)}
fieldset.pick label{align-items:flex-start;gap:10px;cursor:pointer}
fieldset.pick input{margin-top:4px;accent-color:var(--accent)}
.paper{background:var(--surface);border:1px solid var(--line);padding:28px clamp(16px,5vw,40px);display:flex;flex-direction:column;gap:18px}
.boxes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.boxes li{display:flex;gap:10px;align-items:flex-start}
.box{flex:none;width:16px;height:16px;border:1.5px solid var(--ink);margin-top:4px;font-size:12px;line-height:13px;text-align:center}
.sign{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:24px;margin-top:20px}
.sign span{border-top:1px solid var(--ink);padding-top:4px;font-size:13px;color:var(--muted)}
.pickbox{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.pickbox > * + *{margin-top:12px}
.pickbox summary{cursor:pointer;font-weight:600;color:var(--accent)}
.crew select,.pickbox select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.seen{font-size:13px;color:var(--ok)} .unseen{font-size:13px;color:var(--flag)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.photo{display:flex;flex-direction:column;gap:4px;min-width:0;margin:0}
.photo .img{aspect-ratio:4/5;border-radius:8px;overflow:hidden;max-width:100%;display:flex;align-items:flex-end;padding:8px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.photo img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;display:block}
.photo figcaption{font-size:13px;color:var(--muted)}

.preview{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{border-left:3px solid var(--accent);padding-left:12px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.msg .body{white-space:pre-wrap}

form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field textarea,.field select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.field textarea{min-height:88px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.hint{font-size:13px;color:var(--muted)}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0;display:flex;flex-wrap:wrap;gap:8px 18px}
legend{padding:0 6px}
fieldset label{display:flex;gap:6px;align-items:center}
.feed{display:flex;flex-direction:column;gap:10px}
.feed article{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.empty{color:var(--muted);padding:24px 0}
</style>

<div class="app">
  <header class="top">
    <div class="brand">Image Art Teams</div>
    <label class="who" for="whoSel">Viewing as
      <select id="whoSel"></select>
    </label>
  </header>
  <p class="proto">Prototype with example jobs and people. Edits last until you reload, and no emails, texts or calendar events are sent.</p>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <main id="main"></main>
</div>

];
const OFFICE=[
  {id:'admin',name:'Studio manager (you)',short:'Studio manager',ini:'SM'},

];
const TEMPLATE=['ID Cards','Sticker Thumbnails','Picture Packages Delivered','PowerSchool file sent'];
let catalog=TEMPLATE.concat(['Yearbook portraits sent','Retake day photos delivered','Class composites delivered','Team and individual prints delivered','Coach and staff gift prints']);
let equipCatalog=['Strobe with stand','Umbrella','36 in octabox','White reflector','Backdrop stand','Gray seamless, 9 ft','Blue mottled backdrop','Posing stool','Barcode scanner','Tether laptop and cable','Extension cords and gaffer tape','Team bench risers','Battery pack for strobe','Spare camera batteries and cards'];
let kits=[
  {name:'School portrait station',items:['Strobe with stand','Umbrella','White reflector','Blue mottled backdrop','Backdrop stand','Posing stool','Barcode scanner']},
  {name:'League photo day',items:['Team bench risers','Strobe with stand','Battery pack for strobe','Spare camera batteries and cards']}
];
const unavail={dalia:['2026-10-29'],marcus:['2026-10-24'],keisha:['2026-11-03']};
const reminders={dayBefore:true,time:'17:00',nudge:true,nudgeDays:2};
PEOPLE.forEach(p=>{p.email=p.id+'@example.com';});
function addDays(iso,n){const d=pd(iso),p=x=>String(x).padStart(2,'0');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
const TODAY='2026-10-12';
function todayISO(){const n=new Date(),p=x=>String(x).padStart(2,'0');return n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate());}
const P=id=>PEOPLE.find(p=>p.id===id);
let jobs=[
  {id:'j1',title:'Harlow & Finch staff headshots',client:'Harlow & Finch LLP',type:'Corporate headshots',date:'2026-10-14',start:'09:00',end:'12:30',
   address:'410 Mercer Street, Suite 1200, Columbus, OH 43215',setup:'Conference Room B on the 12th floor. Shoot toward the blank north wall, away from the windows.',

   equipment:['2 strobes with stands','9 ft gray seamless and backdrop stand','36 in octabox and a white reflector','85mm and 24-70mm lenses','Tether laptop and cable','Posing stool','Gaffer tape and extension cords'],
   lead:'dalia',crew:['dalia','marcus'],
   notes:'28 people in 6-minute slots. Renee has the sign-up sheet.\nPartners want a second, more relaxed frame without jackets.\nMatch last year\'s crop: mid-chest up, a little headroom.',
   photos:[{cap:'Gray seamless, soft key from camera left',h:205},{cap:'Relaxed frame, jacket off',h:28},{cap:'Crop reference from last year',h:160}]},
  {id:'j2',title:'Nguyen and Abbott wedding',client:'Linh Nguyen and Cole Abbott',type:'Wedding',date:'2026-10-17',start:'14:00',end:'22:00',

   contact:{name:'Marisol Trent',role:'Wedding planner',phone:'(555) 010-8820'},
   equipment:['2 camera bodies each','35mm, 50mm, 85mm and 70-200mm','Second flash and spare batteries','2 off-camera flashes with stands for the reception','Video light for the first dance','Rain covers and clear umbrellas'],
   lead:'priya',crew:['priya','dalia','tomas'],
   notes:'Ceremony at 4:30 PM. Sunset is 6:48 PM, so couple portraits run 6:05 to 6:40 in the vineyard rows.\nNo flash during the ceremony.\nFamily formals list is with Marisol. Grandmother uses a wheelchair, so keep formals on the paved terrace.',

  {id:'j3',title:'Listing shoot, 77 Alder Court',client:'Brightwater Realty',type:'Real estate',date:'2026-10-20',start:'10:30',end:'12:00',
   address:'77 Alder Court, Dublin, OH 43017',setup:'Start with exteriors while the front is in sun, then work the main floor before upstairs.',
   access:'Street parking only. Lockbox is on the side gate and the agent texts the code that morning.',
   contact:{name:'Owen Pruitt',role:'Listing agent',phone:'(555) 010-3306'},
   equipment:['16-35mm lens','Tripod with geared head','Flash for window pulls','Drone and 3 batteries'],
   lead:'marcus',crew:['marcus'],
   notes:'25 finals plus 5 drone frames. Turn on every light and open all blinds.\nSkip the garage and the basement storage room.',
   photos:[{cap:'Kitchen from the corner, verticals straight',h:190},{cap:'Front elevation with the full driveway',h:95}]},

   photos:[{cap:'Step-and-repeat pairs, even light',h:260},{cap:'Speaker at the podium from house left',h:350},{cap:'Candid table shot with room ambience',h:48}]},
  {id:'j5',title:'Fall menu product shoot',client:'Sorrel Street Bakery',type:'Product and food',date:'2026-10-29',start:'07:00',end:'10:00',
   address:'318 Sorrel Street, Columbus, OH 43206',setup:'Table by the front window for natural light. The bakery opens at 10:00, so the front has to be clear by 9:45.',
   access:'Knock at the back door on the alley. One loading space beside the dumpster.',
   contact:{name:'Imani Brooks',role:'Owner',phone:'(555) 010-9042'},
   equipment:['100mm macro and 50mm','Diffusion panel and white and black cards','Overhead arm','Linen and slate surfaces'],
   lead:'priya',crew:['priya'],
   notes:'12 items, each as an overhead and a 45 degree angle. Square crops for their ordering page.',
   photos:[{cap:'Overhead on slate with side light',h:22},{cap:'45 degree angle with a shallow background',h:75}]}
];
let updates=[
  {id:'u1',jobId:'j2',at:'Oct 11, 4:12 PM',changes:['Call time: 2:30 PM → 2:00 PM','Equipment added: Second flash and spare batteries'],seen:{priya:true,tomas:true}}
];
const state={who:'dalia',tab:'jobs',jobId:null,editing:null,sent:null,packed:{},draftPhotos:[]};

const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pd(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function fmtDate(s){const x=pd(s);return DOW[x.getDay()]+', '+MON[x.getMonth()]+' '+x.getDate();}
function fmtTime(t){const a=t.split(':').map(Number);const h=a[0]%12||12;return h+':'+String(a[1]).padStart(2,'0')+' '+(a[0]<12?'AM':'PM');}
function stamp(){const n=new Date();return MON[n.getMonth()]+' '+n.getDate()+', '+fmtTime(n.getHours()+':'+n.getMinutes());}
const isAdmin=()=>OFFICE.some(o=>o.id===state.who);
const J=id=>jobs.find(j=>j.id===id);
J('j2').crew.push('keisha');
J('j4').crew.push('ben');
jobs.push(
  {id:'j6',title:'Westbrook Elementary fall picture day',client:'Westbrook Elementary School',type:'School',date:'2026-10-06',start:'07:30',end:'13:00',
   address:'1450 Linden Avenue, Westerville, OH 43081',setup:'Gym stage. Two portrait stations side by side, with the line forming along the bleachers.',
   access:'Park in the staff lot and check in at the front office for visitor badges. Load in through the gym side doors.',
   contact:{name:'Dana Whitlock',role:'School secretary',phone:'(555) 010-7718'},
   equipment:['2 portrait stations: strobe, umbrella and fill reflector each','Blue mottled backdrops and stands','Barcode scanners and student cards','Posing stools and combs'],
   lead:'dalia',crew:['dalia','tomas','keisha','ben'],
   notes:'Classes come down by grade, starting with kindergarten at 8:00 AM.\nScan each student\'s barcode card before their first frame.',
   photos:[{cap:'Head and shoulders on the blue backdrop',h:215}],
   deliverables:[{name:'ID Cards',done:true,date:'2026-10-09',ini:'SM',by:'Studio manager'},{name:'Sticker Thumbnails',done:true,date:'2026-10-08',ini:'CW',by:'Carla Whitfield'},{name:'Picture Packages Delivered',done:false,due:'2026-10-10'},{name:'PowerSchool file sent',done:false,due:'2026-10-20'}]},
  {id:'j7',title:'Northside Youth Soccer photo day',client:'Northside Youth Soccer League',type:'League',date:'2026-10-24',start:'08:00',end:'14:00',
   address:'Kessler Fields, 900 Kessler Park Drive, Columbus, OH 43214',setup:'Team photos at the bleachers on field 3. Individual portraits under the pavilion.',
   access:'Park in the north lot. The league table is by the concession stand.',
   contact:{name:'Greg Halloran',role:'League coordinator',phone:'(555) 010-2590'},

   lead:'marcus',crew:['marcus','priya','keisha'],
   notes:'22 teams in 15-minute slots. Greg has the schedule.\nTeam photo first, then individuals.',

   deliverables:TEMPLATE.map(n=>({name:n,done:false,due:'2026-11-07'}))}
);
jobs.forEach(j=>{j.rsvp={};j.crew.forEach(c=>{j.rsvp[c]={s:'accepted'};});});
J('j1').rsvp.dalia={s:'pending'};
J('j4').rsvp.marcus={s:'pending'};
J('j2').rsvp.tomas={s:'declined',reason:'Two hour drive each way for me',wants:'j7'};
const rs=(j,c)=>(j.rsvp&&j.rsvp[c])||{s:'pending'};
const active=role=>PEOPLE.filter(p=>!p.inactive&&(!role||p.role===role));
function conflicts(pid,job){
  const out=[];
  if(!job.date)return out;
  if((unavail[pid]||[]).includes(job.date))out.push('marked unavailable on '+fmtDate(job.date));
  jobs.forEach(o=>{if(o.id!==job.id&&o.date===job.date&&o.crew.includes(pid)&&rs(o,pid).s!=='declined'&&o.start<job.end&&job.start<o.end)out.push('also on '+o.title+', '+fmtTime(o.start)+' to '+fmtTime(o.end));});
  return out;
}
function allTasks(){
  const out=[];
  jobs.forEach(j=>(j.deliverables||[]).forEach((x,i)=>{if(!x.done)out.push({j:j,x:x,i:i,over:!!x.due&&x.due<TODAY});}));
  return out.sort((a,b)=>(a.x.due||'9999').localeCompare(b.x.due||'9999'));
}
function visibleJobs(){return jobs.filter(j=>isAdmin()||j.crew.includes(state.who)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));}
function unseen(job,who){return updates.filter(u=>u.jobId===job.id&&!u.seen[who]);}
function mapsUrl(j){return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(j.address);}
function gcalUrl(j){const d=j.date.replace(/-/g,''),t=s=>s.replace(':','')+'00';

      if(d)tags+='<span class="pill">'+d+' declined</span>';

function updateConflicts(){
  const box=document.getElementById('conflictBox');if(!box)return;
  const g=id=>document.getElementById(id).value;
  const job={id:state.editing==='new'?null:state.editing,date:g('fDate'),start:g('fStart'),end:g('fEnd')};
  const ids=PEOPLE.filter(p=>{const c=document.getElementById('fCrew_'+p.id);return c&&c.checked;}).map(p=>p.id);
  [g('fLead'),g('fAsst1'),g('fAsst2')].forEach(a=>{if(a&&!ids.includes(a))ids.push(a);});
  const rows=[];
  ids.forEach(id=>conflicts(id,job).forEach(c=>rows.push('<li><strong>'+esc(P(id).name)+'</strong> is '+esc(c)+'</li>')));
  box.innerHTML=rows.length?'<section class="alert"><strong>Scheduling conflict</strong><ul>'+rows.join('')+'</ul><span>You can still save, but check with them first.</span></section>':'';
}

    pickHtml(j,'fpk')+'<div class="field"><label class="label" for="fTasks">One-off tasks for this job</label><textarea id="fTasks" placeholder="One task per line. Paste a whole list to add them all at once."></textarea>'+
    (j.deliverables&&j.deliverables.length?'<span class="hint">Already on this job: '+j.deliverables.map(x=>esc(x.name)).join(', ')+'.</span>':'')+'</div>'+
    '';
}

function renderJob(){
  const j=J(state.jobId),me=state.who;

  let h='<article class="sheet"><div><button class="linkbtn" data-act="back">← Back to jobs</button></div>';
  if(isAdmin()&&state.sent){const u=updates.find(x=>x.id===state.sent);if(u&&u.jobId===j.id)h+=previewHtml(u,j);}
  if(mine.length) h+='<section class="alert"><strong>Changed since you last looked</strong><ul>'+
    mine.map(u=>u.changes.map(c=>'<li>'+esc(c)+' <span class="meta">('+esc(u.at)+')</span></li>').join('')).join('')+
    '</ul><div><button class="btn small" data-act="ack">Got it</button></div></section>';
  if(isAdmin()&&j.pending&&j.pending.length)h+='<section class="alert"><strong>Saved but not sent yet</strong><ul>'+j.pending.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul>'+
    '<span>'+(j.crew.length?'Tap Notify photographers and staff below to send these.':'Nobody is assigned yet, so there is no one to notify.')+'</span></section>';
  if(!isAdmin())h+=rsvpHtml(j,me);
  h+='<header class="sheet-head"><span class="label">'+esc(j.type)+' · '+esc(j.client)+'</span><h1>'+esc(j.title)+'</h1></header>'+
    '<div class="calltimes"><div><span class="label">Date</span><span class="v">'+fmtDate(j.date)+'</span></div>'+
    '<div><span class="label">Call time</span><span class="v">'+fmtTime(j.start)+'</span></div>'+
    '<div><span class="label">Wrap</span><span class="v">'+fmtTime(j.end)+'</span></div></div>'+
    '<div class="actions"><a class="btn" href="'+mapsUrl(j)+'" target="_blank" rel="noopener">Get directions</a>'+
    '<a class="btn ghost" href="'+gcalUrl(j)+'" target="_blank" rel="noopener">Add to Google Calendar</a>'+
    '<button class="btn ghost" data-act="sheet">Paper copy</button>'+(isAdmin()?'<button class="btn ghost" data-act="edit">Edit job</button><button class="btn ghost" data-act="dup">Duplicate</button>'+(j.crew.length?'<button class="btn ghost" data-act="notifyNow">Notify photographers and staff</button>':''):'')+'</div>';
  if(reminders.dayBefore&&j.date>=TODAY)h+='<p class="hint">Automatic reminder goes out '+fmtDate(addDays(j.date,-1))+' at '+fmtTime(reminders.time)+'.</p>';
  h+='<section class="sec"><h2>Where</h2><dl class="kv"><dt>Address</dt><dd>'+esc(j.address)+'</dd>'+
    '<dt>Set up</dt><dd>'+esc(j.setup)+'</dd><dt>Parking and load-in</dt><dd>'+esc(j.access)+'</dd></dl></section>';
  h+='<section class="sec"><h2>On-site contact</h2><dl class="kv"><dt>Name</dt><dd>'+esc(j.contact.name)+(j.contact.role?', '+esc(j.contact.role):'')+'</dd>'+
    '<dt>Phone</dt><dd><span class="sel" id="phone">'+esc(j.contact.phone)+'</span> <button class="linkbtn" data-act="copy">Copy</button></dd></dl></section>';
  h+='<section class="sec"><h2>Equipment</h2>'+(isAdmin()?'<ul class="plain">'+j.equipment.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul>'
    :'<ul class="checks">'+j.equipment.map((e,i)=>{const k=me+'|'+j.id+'|'+e;
      return '<li><label><input type="checkbox" id="eq'+i+'" data-pack="'+esc(k)+'"'+(state.packed[k]?' checked':'')+'><span>'+esc(e)+'</span></label></li>';}).join('')+'</ul><p class="hint">Tick items off as you pack. Only you see your ticks.</p>')+'</section>';
  h+='<section class="sec"><h2>Who is on this job</h2><ul class="crew">'+j.crew.slice().sort((a,b)=>P(a).role===P(b).role?0:P(a).role==='photographer'?-1:1).map(c=>{
    const r=rs(j,c);
    let s=r.s==='accepted'?'<span class="seen">Accepted</span>':r.s==='declined'?'<span class="unseen">Declined'+(isAdmin()&&r.reason?': '+esc(r.reason):'')+'</span>':'<span class="unseen">Awaiting reply</span>';
    if(isAdmin()&&last&&r.s!=='declined') s+=last.seen[c]?'<span class="seen">Seen latest update</span>':'<span class="unseen">Not seen latest update</span>';
    if(isAdmin()&&r.s!=='declined'){const cf=conflicts(c,j);if(cf.length)s+='<span class="unseen">Conflict: '+esc(cf.join('; '))+'</span>';}
    if(isAdmin()&&r.s==='declined'){
      const w=r.wants&&J(r.wants);
      if(w)s+='<span class="meta">'+(r.moved?'Moved to ':'Asked to work ')+esc(w.title)+', '+fmtDate(w.date)+(r.moved?'':' instead')+'</span>'+
        (r.moved?'':'<button class="btn small" data-act="approveMove" data-id="'+c+'">Approve move</button>');
      const free=PEOPLE.filter(p=>!p.inactive&&p.role===P(c).role&&!j.crew.includes(p.id));
      s+=free.length?'<span class="rowwrap"><select id="rep_'+c+'" aria-label="Replacement for '+esc(P(c).name)+'">'+free.map(p=>'<option value="'+p.id+'">'+esc(p.name)+(conflicts(p.id,j).length?' (conflict)':'')+'</option>').join('')+'</select><button class="btn small" data-act="reassign" data-id="'+c+'">Reassign</button></span>'
        :'';
      s+='<button class="btn ghost small" data-act="removeCrew" data-id="'+c+'">Remove from job</button>';
    }
    return '<li><span>'+esc(P(c).name)+(c===me?' (you)':'')+'</span><span class="meta">'+(P(c).role==='assistant'?'Assistant':'Photographer')+'</span>'+(c===j.lead?'<span class="pill quiet">Lead</span>':'')+s+'</li>';}).join('')+'</ul></section>';
  if(isAdmin())h+=delivHtml(j);
  h+='<section class="sec"><h2>Notes</h2><div class="note">'+esc(j.notes||'No notes yet.')+'</div></section>';
  h+='<section class="sec"><h2>Sample photos</h2><p class="hint">Reference shots for the look to aim for on this job.</p>'+
    (j.photos.length?'<div class="photos">'+j.photos.map((p,i)=>photoHtml(p,i,false)).join('')+'</div>':'<p class="meta">None added yet.</p>')+'</section>';
  return h+'</article>';
}

function renderDraftPhotos(){const el=document.getElementById('draftPhotos');if(el)el.innerHTML=state.draftPhotos.map((p,i)=>photoHtml(p,i,true)).join('');}

function renderUpdates(){
  const ids=visibleJobs().map(j=>j.id);
  const list=updates.filter(u=>ids.includes(u.jobId)).slice().reverse();
  if(!list.length) return '<p class="empty">No changes yet. When a job you are on changes, it shows up here.</p>';
  return '<div class="feed">'+list.map(u=>{const j=J(u.jobId);
    const status=isAdmin()?'<span class="meta">'+j.crew.map(c=>esc(P(c).name)+': '+(u.seen[c]?'<span class="seen">seen</span>':'<span class="unseen">not seen</span>')).join(' · ')+'</span>'
      :(u.seen[state.who]?'':'<span><span class="pill">New</span></span>');
    return '<article>'+status+'<span class="meta">'+esc(u.at)+'</span><h3>'+esc(j.title)+' <span class="meta">'+fmtDate(j.date)+'</span></h3>'+
      '<ul class="plain">'+u.changes.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul><div><button class="linkbtn" data-act="open" data-id="'+j.id+'">Open call sheet</button></div></article>';}).join('')+'</div>';
}

function render(scroll){
  renderTabs();
  const m=document.getElementById('main');
  m.innerHTML=state.importing?renderImport():state.editing?renderEdit():state.jobId?(state.sheet?renderSheet():renderJob()):state.tab==='updates'?renderUpdates():state.tab==='catalog'&&isAdmin()?renderCatalog():isAdmin()&&state.tab==='due'?renderDue():isAdmin()&&state.tab==='equip'?renderEquip():isAdmin()&&state.tab==='team'?renderTeam():!isAdmin()&&state.tab==='avail'?renderAvail():renderList();
  if(state.editing){renderDraftPhotos();updateConflicts();}
  if(scroll)window.scrollTo(0,0);
}

function diff(a,b){
  const c=[];
  const t=(label,x,y)=>{if(x!==y)c.push(label+': '+(x||'none')+' → '+(y||'none'));};
  t('Job name',a.title,b.title);
  t('Date',fmtDate(a.date),fmtDate(b.date));
  t('Call time',fmtTime(a.start),fmtTime(b.start));
  t('Wrap',fmtTime(a.end),fmtTime(b.end));
  t('Address',a.address,b.address);
  if(a.setup!==b.setup)c.push('Set-up location changed');
  if(a.access!==b.access)c.push('Parking and load-in changed');
  t('Contact',a.contact.name,b.contact.name);
  t('Contact phone',a.contact.phone,b.contact.phone);
  b.equipment.filter(e=>!a.equipment.includes(e)).forEach(e=>c.push('Equipment added: '+e));
  a.equipment.filter(e=>!b.equipment.includes(e)).forEach(e=>c.push('Equipment removed: '+e));
  b.crew.filter(p=>!a.crew.includes(p)).forEach(p=>c.push(P(p).name+' added to the job'));
  a.crew.filter(p=>!b.crew.includes(p)).forEach(p=>c.push(P(p).name+' removed from the job'));
  if(a.lead!==b.lead&&b.lead)c.push('Lead photographer: '+P(b.lead).name);
  if(a.notes!==b.notes)c.push('Notes changed');
  if(b.photos.length>a.photos.length)c.push((b.photos.length-a.photos.length)+' sample photo(s) added');
  if(b.photos.length<a.photos.length)c.push((a.photos.length-b.photos.length)+' sample photo(s) removed');
  return c;
}

function save(notify){
  const v=id=>document.getElementById(id).value.trim();
  const err=document.getElementById('formErr');
  if(!v('fTitle')||!v('fDate')||!v('fStart')||!v('fEnd')){err.textContent='Add a job name, date, call time and wrap time before saving.';return;}
  let crew=PEOPLE.filter(p=>p.role==='photographer'&&(document.getElementById('fCrew_'+p.id)||{}).checked).map(p=>p.id);
  const lead=v('fLead');
  if(lead&&!crew.includes(lead))crew.unshift(lead);
  [v('fAsst1'),v('fAsst2')].forEach(a=>{if(a&&!crew.includes(a))crew.push(a);});
  const next={title:v('fTitle'),client:v('fClient'),type:v('fType')||'Shoot',date:v('fDate'),start:v('fStart'),end:v('fEnd'),address:v('fAddress'),
    setup:v('fSetup'),access:v('fAccess'),contact:{name:v('fCName'),role:v('fCRole'),phone:v('fCPhone')},
    equipment:v('fEquip').split('\n').map(s=>s.trim()).filter(Boolean),lead:lead,crew:crew,notes:v('fNotes'),photos:state.draftPhotos.slice()};
  const prev=state.editing==='new'?{}:(J(state.editing).rsvp||{});
  next.rsvp={};crew.forEach(c=>{next.rsvp[c]=prev[c]||{s:'pending'};});
  next.deliverables=(state.editing==='new'?[]:(J(state.editing).deliverables||[])).slice();
  if(state.editing==='new'&&state.dupFrom&&J(state.dupFrom))addTasks(next,(J(state.dupFrom).deliverables||[]).map(x=>x.name));
  state.dupFrom=null;
  addTasks(next,picked());
  addTasks(next,v('fTasks').split('\n'));
  let changes;
  if(state.editing==='new'){next.id='j'+Date.now();jobs.push(next);changes=['New job assigned to you'];}
  else{const old=J(state.editing);next.id=old.id;changes=(old.pending||[]).concat(diff(old,next));jobs[jobs.indexOf(old)]=next;}
  changes=changes.filter((c,i)=>changes.indexOf(c)===i);
  state.sent=null;
  if(notify&&changes.length&&crew.length){const u={id:'u'+Date.now(),jobId:next.id,at:stamp(),changes:changes,seen:{}};updates.push(u);state.sent=u.id;next.pending=[];}
  else next.pending=changes;
  state.jobId=next.id;state.editing=null;render(true);
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='import'){state.importing=true;state.jobId=null;state.editing=null;state.sent=null;render(true);return;}
  if(a==='importGo'){
    calEvents.forEach((ev,i)=>{
      if(ev.done||!document.getElementById('imp'+i).checked)return;
      ev.done=true;
      jobs.push({id:'j'+Date.now()+i,draft:true,title:ev.title,client:'',type:'Imported from Google Calendar',date:ev.date,start:ev.start,end:ev.end,address:ev.address,
        setup:'',access:'',contact:{name:'',role:'',phone:''},equipment:[],lead:'',crew:[],notes:'',photos:[],rsvp:{}});
    });
    state.importing=false;state.tab='jobs';render(true);return;
  }
  state.importing=false;
  if(a==='sheet'){state.sheet=true;render(true);return;}
  state.sheet=false;
  if(a==='sheetBack'){render(true);return;}
  if(a==='tab'){state.tab=el.dataset.tab;state.jobId=null;state.editing=null;state.sent=null;render(true);}
  else if(a==='open'){state.jobId=el.dataset.id;state.sent=null;state.declining=false;render(true);}
  else if(a==='back'){state.jobId=null;state.sent=null;render(true);}
  else if(a==='ack'){updates.forEach(u=>{if(u.jobId===state.jobId)u.seen[state.who]=true;});render(false);}
  else if(a==='edit'){state.editing=state.jobId;state.draftPhotos=J(state.jobId).photos.slice();render(true);}
  else if(a==='new'){state.editing='new';state.dupFrom=null;state.jobId=null;state.draftPhotos=[];render(true);}
  else if(a==='dup'){state.dupFrom=state.jobId;state.editing='new';state.draftPhotos=J(state.jobId).photos.slice();state.jobId=null;render(true);}
  else if(a==='eqRm'){equipCatalog.splice(Number(el.dataset.i),1);render(false);}
  else if(a==='eqAdd'){
    document.getElementById('eqNew').value.split('\n').map(s=>s.trim()).filter(Boolean).forEach(n=>{if(!equipCatalog.some(c=>c.toLowerCase()===n.toLowerCase()))equipCatalog.push(n);});
    render(false);
  }
  else if(a==='kitRm'){kits.splice(Number(el.dataset.i),1);render(false);}
  else if(a==='kitAdd'){
    const n=document.getElementById('kitName').value.trim(),it=document.getElementById('kitItems').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(n&&it.length){kits.push({name:n,items:it});render(false);}
  }
  else if(a==='eqAddKit'){const k=kits[Number(document.getElementById('fKit').value)];if(k)appendEquip(k.items);}
  else if(a==='eqAddPicked'){const b=Array.from(document.querySelectorAll('input[data-eq]:checked'));appendEquip(b.map(x=>x.dataset.eq));b.forEach(x=>{x.checked=false;});}
  else if(a==='offAdd'){
    const d=document.getElementById('offDate').value;
    if(d){const l=unavail[state.who]||(unavail[state.who]=[]);if(!l.includes(d))l.push(d);render(false);}
  }
  else if(a==='offRm'){unavail[state.who]=(unavail[state.who]||[]).filter(d=>d!==el.dataset.d);render(false);}
  else if(a==='teamRm'){P(el.dataset.id).inactive=true;buildWho();render(false);}
  else if(a==='teamAdd'){
    const n=document.getElementById('tName').value.trim(),m=document.getElementById('tEmail').value.trim();
    if(!n||m.indexOf('@')<1){document.getElementById('teamErr').textContent='Add a name and a valid email address.';}
    else{PEOPLE.push({id:'p'+Date.now(),name:n,role:document.getElementById('tRole').value,email:m});buildWho();render(false);}
  }
  else if(a==='cancel'){state.editing=null;render(true);}
  else if(a==='rmphoto'){state.draftPhotos.splice(Number(el.dataset.i),1);renderDraftPhotos();}
  else if(a==='accept'){J(state.jobId).rsvp[state.who]={s:'accepted'};state.declining=false;render(false);}
  else if(a==='decline'){state.declining=true;render(false);}
  else if(a==='declineCancel'){state.declining=false;render(false);}
  else if(a==='declineSend'){J(state.jobId).rsvp[state.who]={s:'declined',reason:document.getElementById('declineReason').value.trim(),wants:(document.querySelector('input[name="wants"]:checked')||{value:''}).value};state.declining=false;render(true);}
  else if(a==='reassign'){
    const j=J(state.jobId),out=el.dataset.id,inn=document.getElementById('rep_'+out).value;
    j.crew=j.crew.map(c=>c===out?inn:c);delete j.rsvp[out];j.rsvp[inn]={s:'pending'};
    if(j.lead===out)j.lead=inn;
    const u={id:'u'+Date.now(),jobId:j.id,at:stamp(),changes:[P(inn).name+' added to the job',P(out).name+' removed from the job'],seen:{}};
    updates.push(u);state.sent=u.id;render(true);
  }
  else if(a==='approveMove'){
    const j=J(state.jobId),c=el.dataset.id,r=j.rsvp[c],w=J(r.wants);
    if(!w.crew.includes(c))w.crew.push(c);
    w.rsvp[c]={s:'accepted'};r.moved=true;
    updates.push({id:'u'+Date.now(),jobId:w.id,at:stamp(),changes:[P(c).name+' added to the job'],seen:{}});
    render(false);
  }
  else if(a==='removeCrew'){
    const j=J(state.jobId),c=el.dataset.id;
    j.crew=j.crew.filter(x=>x!==c);delete j.rsvp[c];if(j.lead===c)j.lead='';
    if(j.crew.length)updates.push({id:'u'+Date.now(),jobId:j.id,at:stamp(),changes:[P(c).name+' removed from the job'],seen:{}});
    render(false);
  }
  else if(a==='delRm'){J(state.jobId).deliverables.splice(Number(el.dataset.i),1);render(false);}
  else if(a==='delAdd'){addTasks(J(state.jobId),picked().concat(document.getElementById('delNew').value.split('\n')));render(false);}
  else if(a==='notifyNow'){
    const j=J(state.jobId),ch=j.pending&&j.pending.length?j.pending:['Reminder: please review this call sheet'];
    const u={id:'u'+Date.now(),jobId:j.id,at:stamp(),changes:ch,seen:{}};
    updates.push(u);j.pending=[];state.sent=u.id;render(true);
  }
  else if(a==='catRm'){catalog.splice(Number(el.dataset.i),1);render(false);}
  else if(a==='catAdd'){
    document.getElementById('catNew').value.split('\n').map(s=>s.trim()).filter(Boolean).forEach(n=>{if(!catalog.some(c=>c.toLowerCase()===n.toLowerCase()))catalog.push(n);});
    render(false);
  }
  else if(a==='copy'){
    const span=document.getElementById('phone');
    const done=()=>{el.textContent='Copied';};
    const fallback=()=>{const r=document.createRange();r.selectNodeContents(span);const s=getSelection();s.removeAllRanges();s.addRange(r);el.textContent='Selected';};
    try{navigator.clipboard.writeText(span.textContent).then(done,fallback);}catch(x){fallback();}
  }
});
document.addEventListener('submit',e=>{if(e.target.id==='jobForm'){e.preventDefault();save(!!e.submitter&&e.submitter.dataset.notify==='1');}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(state.editing&&t.closest&&t.closest('#jobForm'))updateConflicts();
  if(t.dataset&&t.dataset.pack){state.packed[t.dataset.pack]=t.checked;}
  else if(t.dataset&&t.dataset.deldue!==undefined){J(state.jobId).deliverables[Number(t.dataset.deldue)].due=t.value;render(false);}
  else if(t.id==='rDay'){reminders.dayBefore=t.checked;}
  else if(t.id==='rTime'){reminders.time=t.value||'17:00';}
  else if(t.id==='rNudge'){reminders.nudge=t.checked;}
  else if(t.id==='rDays'){reminders.nudgeDays=Number(t.value);}
  else if(t.dataset&&t.dataset.del!==undefined){
    const x=J(t.dataset.delj||state.jobId).deliverables[Number(t.dataset.del)],o=OFFICE.find(p=>p.id===state.who);
    x.done=t.checked;
    if(x.done){x.date=todayISO();x.ini=o.ini;x.by=o.short;}
    render(false);
  }
  else if(t.dataset&&t.dataset.deldate!==undefined){J(state.jobId).deliverables[Number(t.dataset.deldate)].date=t.value;}
  else if(t.id==='fPhotos'){
    Array.from(t.files).forEach(file=>{const r=new FileReader();
      r.onload=()=>{state.draftPhotos.push({src:r.result,cap:file.name.replace(/\.[^.]+$/,'')});renderDraftPhotos();};
      r.readAsDataURL(file);});
    t.value='';
  }
  else if(t.id==='whoSel'){state.importing=false;state.who=t.value;state.jobId=null;state.editing=null;state.sent=null;state.tab='jobs';render(true);}
});

function buildWho(){document.getElementById('whoSel').innerHTML='<optgroup label="Studio">'+OFFICE.map(o=>'<option value="'+o.id+'"'+(o.id===state.who?' selected':'')+'>'+esc(o.name)+'</option>').join('')+'</optgroup><optgroup label="Photographers and assistants">'+
  active().map(p=>'<option value="'+p.id+'"'+(p.id===state.who?' selected':'')+'>'+esc(p.name)+'</option>').join('')+'</optgroup>';}
buildWho();
render(false);
</script>
